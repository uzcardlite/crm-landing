<!doctype html>
<html lang="uz">

    <!-- Google Search's own favicon crawler does not reliably pick up an
         SVG-only icon — it wants a square PNG/ICO at a size that is a
         multiple of 48px, plus /favicon.ico at the root. The current logo
         is a raster mark (no vector source), so PNG/ICO only. -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />

    <title>Milliy CRM — o'quv markazingiz uchun CRM</title>

    <link rel="canonical" href="https://ncrm.uz/" />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Milliy CRM" />
    <meta property="og:title" content="Milliy CRM — o'quv markazingiz uchun CRM" />

    <meta property="og:url" content="https://ncrm.uz/" />
    <!-- PNG, not the SVG logo: Facebook/Telegram/WhatsApp link previews don't
         render SVG at all, so og:image/twitter:image must be a raster file. -->

    <meta property="og:locale" content="uz_UZ" />
