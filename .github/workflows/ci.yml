name: CI

# This repository had no workflows at all: pushes went straight to Vercel with
# nothing checking that the code lints or even builds. This job is that gate.
on:
  push:
  pull_request:

# A newer push to the same branch makes the running job pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        # 22.x is Vercel's default runtime for this project and satisfies
        # Vite's ^20.19 || >=22.12 requirement.
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        # No test suite in this app yet. Run it the moment one is added; skip
        # loudly (not silently) until then. package.json is never modified by CI.
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['test:run'] ? 0 : 1)"; then
            npm run test:run
          else
            echo "::notice::No \"test:run\" script in package.json yet - skipping tests."
          fi

      - name: Build
        # src/config.js falls back to this same URL, so the build is green
        # either way; setting it explicitly keeps CI honest about what ships.
        run: npm run build
        env:
          VITE_API_URL: https://crm-backend-production-49b2.up.railway.app
